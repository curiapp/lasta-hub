<div class="toast toast-bottom toast-end z-50 mb-4 max-w-sm">
  @for(toast of toastService.messages(); track toast.id){
    <div class="alert grid grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-3 rounded-md border border-base-300 bg-base-100 px-3 py-2 text-base-content shadow-lg"
      [class.border-success]="toast.type === 'success'"
      [class.border-error]="toast.type === 'error'"
      [class.border-warning]="toast.type === 'warning'"
      [class.border-info]="toast.type === 'info'">
      <span class="material-symbols-rounded text-xl"
        [class.text-success]="toast.type === 'success'"
        [class.text-error]="toast.type === 'error'"
        [class.text-warning]="toast.type === 'warning'"
        [class.text-info]="toast.type === 'info'">
        {{ toast.type === 'success' ? 'check_circle' : toast.type === 'error' ? 'error' : toast.type === 'warning' ? 'warning' : 'info' }}
      </span>
      <span class="min-w-0 text-xs leading-snug">{{toast.message}}</span>
      <button class="btn btn-ghost btn-square btn-xs" type="button" title="Dismiss"
        (click)="close(toast.id)">
        <span class="material-symbols-rounded text-base">close</span>
      </button>
    </div>
  }
</div>
