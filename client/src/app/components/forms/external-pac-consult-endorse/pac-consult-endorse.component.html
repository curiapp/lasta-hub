<div class="space-y-4">
  <h3 class="text-xl">Final Draft - PDQA Recommendation </h3>
  <form #pacForm="ngForm" class="space-y-4">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Date</legend>
      <input id="date" type="Date" class="input input-sm input-bordered" required [(ngModel)]="model.consultationDate"
        ng2-datetime-picker date-only="true" name="consultationDate" placeholder="YYYY-MM-DD" #cdate="ngModel" />
      @if (cdate.invalid && cdate.touched) {
      <div class="label label-text-alt text-red-700">Endorsement Date is required</div>
      }
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Final Draft and PDQA Inputs</legend>
      <file-upload [pid]="pid" [url]="url" itemAlias="recommendation"></file-upload>
    </fieldset>

    <div class="flex gap-2 justify-start">
      <button type="button" class="btn btn-primary btn-sm flex-auto" (click)="onUpload('approve')"
        [disabled]="!fileUpload?.uploader?.queue.length || !pacForm.form.valid">
        Recommended to Bos
      </button>
      <button type="button" class="btn btn-secondary btn-sm w-24" (click)="onUpload('decline')"
        [disabled]="!fileUpload?.uploader?.queue.length || !pacForm.form.valid">
        Defer
      </button>
    </div>
  </form>
</div>
