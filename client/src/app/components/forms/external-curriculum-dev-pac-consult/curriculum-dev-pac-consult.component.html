<div class="space-y-4">
  <h3 class="form-title-label">PAC Consultation & Benchmarking</h3>
    <form #consultForm="ngForm" class="space-y-4">
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Date</legend>
          <input id="date" type="date" class="input input-sm input-bordered w-full" required [(ngModel)]="model.consultationDate"
            ng2-datetime-picker date-only="true" name="consultationDate" placeholder="YYYY-MM-DD" #cdate="ngModel" />
        @if (cdate.invalid && cdate.touched) {
        <div class="label label-text-alt text-red-700">Consultation Date is required</div>
        }
      </fieldset>

      <fieldset class="fieldset">
        <legend class="fieldset-legend">Final Draft/Minutes/Comments/Endorsement Letters: </legend>
        <file-upload [pid]="pid" [url]="url" itemAlias="pac-start"></file-upload>
      </fieldset>

      <div class="flex items-center justify-center">
        <button type="button" class="btn btn-primary btn-sm w-full" (click)="onUpload()"
          [disabled]="!fileUpload?.uploader?.queue.length || !consultForm.form.valid">
          submit
          <span class="material-symbols-rounded">
            cloud_upload
            </span>
        </button>
      </div>
    </form>
</div>
