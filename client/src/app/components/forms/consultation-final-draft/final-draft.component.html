<div class="space-y-4">
  <h3 class="text-xl">Final Draft Submission to BOS</h3>
  <form #concludeForm="ngForm" class="space-y-2">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Date</legend>
      <input id="date" type="date" class="input input-sm input-bordered w-full" required [(ngModel)]="date"
        ng2-datetime-picker date-only="true" name="date" placeholder="YYYY-MM-DD" #cdate="ngModel" />
      @if (cdate.invalid && cdate.touched) {
      <span class="label text-error">Circulation date required*</span>
      }
    </fieldset>

    <file-upload-multiple [pid]="pid" [url]="url" [fileTypeList]="fileTypeList" />

    <div class="mt-3">
      <button type="button" class="btn btn-primary btn-sm w-full" (click)="onUpload()"
        [disabled]="fileUpload?.uploader?.queue?.length < 1 || concludeForm.invalid">
        Submit
        <span class="material-symbols-rounded">cloud_upload</span>
      </button>
    </div>
  </form>
</div>
