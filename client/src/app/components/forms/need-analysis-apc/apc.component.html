<div class="space-y-4">
  <h3 class="text-xl mb-4">APC Recommedation</h3>
  <form #senateForm="ngForm" class="space-y-2">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Consultation Date</legend>
      <input id="date" type="Date" class="input input-bordered w-full" required [(ngModel)]="model.date"
        ng2-datetime-picker date-only="true" name="date" placeholder="YYYY-MM-DD" #cdate="ngModel" />
      @if(cdate.invalid && cdate.touched){
      <span class="label text-error">consultation date required*</span>
      }
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Decision</legend>
      <fieldset class="w-full border-2 border-gray-300 border-dashed rounded-lg p-3 space-y-1">
        <div class="custom-control custom-radio custom-control-inline">
          <input type="radio" class="radio radio-xs" id="status1" name="status" [(ngModel)]="model.status"
            value="recommend" required #status="ngModel" mdbInput>
          <label class="custom-control-label" for="status1"> Recommend</label>
        </div>
        <div class="custom-control custom-radio custom-control-inline">
          <input type="radio" class="radio radio-xs" id="status2" name="status" [(ngModel)]="model.status"
            value="decline" required #status="ngModel" mdbInput>
          <label class="custom-control-label" for="status2"> Decline</label>
        </div>
        <div class="custom-control custom-radio custom-control-inline">
          <input type="radio" class="radio radio-xs" id="status3" name="status" [(ngModel)]="model.status" value="defer"
            required #status="ngModel" mdbInput>
          <label class="custom-control-label" for="status3"> Defer</label>
        </div>
      </fieldset>
      @if(status.invalid && status.touched){
      <div class="label label-text-alt text-red-700">APC Decision is required</div>
      }
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">APC Recommendation File</legend>
      <file-upload [pid]="pid" [url]="url" itemAlias="apc"></file-upload>
    </fieldset>

    <div class="form-control">
      <button type="button" class="btn btn-sm btn-primary w-full" (click)="onUpload()"
        [disabled]="!fileUpload?.uploader?.queue.length || !senateForm.form.valid">
        Submit
        <span class="material-symbols-rounded">
          cloud_upload
        </span>
      </button>
    </div>
  </form>
</div>
