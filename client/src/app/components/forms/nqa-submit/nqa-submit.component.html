<div class="space-y-4">
  <h3 class="text-xl">NQA Feedback </h3>
  <form #concludeForm="ngForm" class="space-y-2">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Submission type</legend>
      <div class="p-2 rounded-lg border-2 border-dashed border-gray-300 flex gap-4 items-center flex-wrap">
        <div class="flex items-center gap-2">
          <input class="radio radio-xs" type="radio" id="status1" name="type" [(ngModel)]="model.type" [value]="true"
            required #type="ngModel" mdbInput>
          <label class="label label-text" for="status1">Initial Submit </label>
        </div>
        <div class="flex items-center gap-2">
          <input class="radio radio-xs" type="radio" id="status2" name="type" [(ngModel)]="model.type" [value]="false"
            required #type="ngModel" mdbInput>
          <label class="label label-text" for="status2">Resubmission</label>
        </div>
      </div>
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Qualification Document:</legend>
      <file-upload [pid]="pid" [url]="url" itemAlias="pdu-recommendation"></file-upload>
    </fieldset>

    <div class="flex">
      <button type="button" class="btn btn-primary btn-sm w-full" (click)="onUpload()"
        [disabled]="!fileUpload?.uploader?.queue.length || !concludeForm.form.valid">
        Save
      </button>
    </div>
  </form>
</div>
