<div class="space-y-2">
  <h3 class="text-xl">NQF Documentation </h3>
  <div class="space-y-2">

    <file-upload-multiple [pid]="pid" [url]="url" [fileTypeList]="fileTypeList" />

    <div class="mt-3">
      <button type="button" class="btn btn-primary btn-sm w-full" (click)="onUpload()"
        [disabled]="fileUpload?.uploader?.queue?.length < 1">
        Submit
        <span class="material-symbols-rounded">
          cloud_upload
        </span>
      </button>
    </div>
  </div>
</div>
