<div class="space-y-4" r>
  <h3 class="form-title-label"> Curriculum Development - COLL Session </h3>
  <form #concludeForm="ngForm" class="space-y-2">
    <div class="form-group">
      <label for="doc"> Minutes: </label>
      <div class="input-group mb-3">
        <div class="input-group-prepend">
          <label>
            <span style="height:40px" class="m-0 px-3 py-2 btn btn-primary btn-lg" id="button-addon1">
              Browse
              <input class="form-control" #selectedFile type="file" name="check-list" ng2FileSelect
                [uploader]="uploader" (change)="updateFile()" style="display: none;" />
            </span>
          </label>
        </div>
        <input style="height:40px" type="text" id="file-name" class="form-control" placeholder="NO FILE SELECTED"
          aria-describedby="button-addon1" readonly>
        <div class="input-group-append">
          <button mdbBtn type="button" color="danger" class="m-0 px-3 py-2" style="height:40px" mdbWavesEffect
            (click)="removefile();uploader.clearQueue();" [disabled]="!uploader.getNotUploadedItems().length">X</button>
        </div>
      </div>
    </div>
    <div class="form-group">
      <button type="submit" class="btn btn-default" (click)="clear();uploader.clearQueue();">Cancel</button>
      <button type="button" class="btn btn-success btn-s" (click)="setDecission('approve');uploader.uploadAll()"
        [disabled]="!uploader.getNotUploadedItems().length || !concludeForm.form.valid">
        Approve</button>
      <button type="button" class="btn btn-success btn-s" (click)="setDecission('decline');uploader.uploadAll()"
        [disabled]="!uploader.getNotUploadedItems().length || !concludeForm.form.valid">
        Decline</button>
    </div>
  </form>
</div>
